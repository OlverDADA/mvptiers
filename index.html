<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MVPtiers | Elite Leaderboard</title>
    <style>
        :root {
            --bg-dark: #030407;
            --card-bg: rgba(13, 15, 24, 0.8);
            --panel-bg: rgba(10, 12, 20, 0.6);
            --accent-purple: #7c3aed;
            --accent-blue: #00d4ff;
            --accent-yellow: #f1c40f;
            --clr-netherite: #464646; --clr-diamond: #33ebff; --clr-gold: #ffcc00; --clr-iron: #d1d1d1;
            --grad-gold: linear-gradient(90deg, #ffe259 0%, #ffa751 100%);
            --grad-silver: linear-gradient(90deg, #e6e9f0 0%, #bdc3c7 100%);
            --grad-bronze: linear-gradient(90deg, #ff9d6c 0%, #9e4b1d 100%);
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; min-height: 100vh; overflow-x: hidden; position: relative; }
        
        /* --- ЖИВОЙ ФОН --- */
        .universe-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg-dark); }
        .header-aura { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 1200px; height: 400px; background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, transparent 70%); filter: blur(60px); z-index: 0; }
        .nebula { position: absolute; width: 80vw; height: 80vh; border-radius: 50%; filter: blur(150px); opacity: 0.15; animation: moveNebula 25s infinite alternate ease-in-out; }
        .neb-1 { background: var(--accent-purple); top: -20%; left: -20%; }
        .neb-2 { background: var(--accent-blue); bottom: -20%; right: -10%; }
        @keyframes moveNebula { from { transform: translate(0, 0) scale(1); } to { transform: translate(10vw, 15vh) scale(1.2); } }
        .grid-layer { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 60px 60px; transform: perspective(500px) rotateX(20deg); animation: gridScroll 40s linear infinite; }
        @keyframes gridScroll { from { background-position: 0 0; } to { background-position: 0 600px; } }

        /* --- ШАПКА --- */
        .logo-section { position: relative; z-index: 10; margin-bottom: 40px; padding: 20px 60px; border-radius: 100px; background: rgba(124, 58, 237, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(124, 58, 237, 0.1); }
        .logo { font-size: 6.5em; font-weight: 900; letter-spacing: -6px; background: linear-gradient(135deg, #fff 0%, #a855f7 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.4)); margin: 0; }

        .tabs-wrapper { background: rgba(10, 12, 20, 0.8); padding: 10px; border-radius: 20px; border: 1px solid rgba(124, 58, 237, 0.3); margin-bottom: 50px; z-index: 10; }
        .tabs-container { display: flex; gap: 15px; }
        .tab-btn { padding: 14px 45px; border: none; background: transparent; color: #888; font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; transition: 0.4s; }
        .tab-btn.active { background: var(--accent-yellow); color: #000; box-shadow: 0 0 25px rgba(241, 196, 15, 0.4); }

        .admin-login-btn { position: fixed; top: 25px; right: 25px; padding: 10px 25px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; border-radius: 30px; cursor: pointer; backdrop-filter: blur(10px); z-index: 9999; font-size: 0.8em; font-weight: bold; }

        /* --- ТАБЛИЦА --- */
        .top-panel-wrapper { position: relative; padding: 3px; border-radius: 32px; background: linear-gradient(45deg, transparent, #7c3aed, #00d4ff, transparent); background-size: 400% 400%; animation: borderGlow 8s linear infinite; z-index: 10; width: 100%; max-width: 950px; }
        @keyframes borderGlow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .top-panel { background: var(--panel-bg); border-radius: 30px; padding: 40px; backdrop-filter: blur(40px); width: 100%; min-height: 100px; box-sizing: border-box; }
        .player-list { display: flex; flex-direction: column; gap: 15px; }
        
        .player-card { 
            background: var(--card-bg); padding: 22px 35px; border-radius: 24px; 
            display: grid; grid-template-columns: 80px 1fr 250px 140px; 
            align-items: center; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; 
        }
        body.admin-mode .player-card { grid-template-columns: 80px 1fr 250px 140px 45px; }

        /* --- КРУПНЫЕ ЖИРНЫЕ НОМЕРА --- */
        .rank { 
            font-size: 2.8em; font-weight: 900; line-height: 1; 
            color: rgba(255, 255, 255, 0.15); font-style: italic;
            transition: 0.3s;
        }
        .rank-1 .rank { color: #ffcc00; text-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
        .rank-2 .rank { color: #ffffff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        .rank-3 .rank { color: #cd7f32; text-shadow: 0 0 15px rgba(205, 127, 50, 0.4); }

        .nickname { font-size: 1.8em; font-weight: 800; color: #fff; }
        .rank-1 .nickname { background: var(--grad-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .rank-2 .nickname { background: var(--grad-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .rank-3 .nickname { background: var(--grad-bronze); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .tier-badge { font-weight: 900; text-transform: uppercase; padding: 10px 22px; border-radius: 14px; display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 0.95em; width: fit-content; margin: 0 auto; }
        .t-netherite { background: rgba(70, 70, 70, 0.4); border: 1px solid var(--clr-netherite); color: #fff; }
        .t-diamond { background: rgba(51, 226, 255, 0.2); border: 1px solid var(--clr-diamond); color: var(--clr-diamond); }
        .t-gold { background: rgba(255, 204, 0, 0.2); border: 1px solid var(--clr-gold); color: var(--clr-gold); }
        .t-iron { background: rgba(209, 209, 209, 0.2); border: 1px solid var(--clr-iron); color: var(--clr-iron); }

        .points { text-align: right; font-weight: 900; color: #fff; font-size: 1.6em; }
        .del-btn { display: none; background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.5em; }
        body.admin-mode .del-btn { display: block; }
        
        .admin-panel { display: none; margin-top: 40px; background: rgba(15, 17, 26, 0.98); padding: 35px; border-radius: 25px; flex-wrap: wrap; gap: 15px; border: 1px solid var(--accent-purple); width: 100%; max-width: 880px; z-index: 10; box-sizing: border-box; }
        input, select, .add-btn, .save-btn { padding: 15px; border-radius: 10px; border: 1px solid #2d3247; background: #05060a; color: white; outline: none; }
        .add-btn { background: var(--accent-purple); border: none; font-weight: bold; cursor: pointer; padding: 15px 45px; }
        .save-btn { background: #27ae60; border: none; font-weight: bold; cursor: pointer; padding: 15px 30px; }
    </style>
</head>
<body id="mainBody">
    <div class="universe-bg">
        <div class="header-aura"></div>
        <div class="grid-layer"></div>
        <div class="nebula neb-1"></div>
        <div class="nebula neb-2"></div>
    </div>

    <button class="admin-login-btn" id="loginBtn" onclick="tryLogin()">Admin Hub</button>
    
    <div class="logo-section">
        <h1 class="logo">MVPtiers</h1>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab(this, '1-3')">1-3 ВЖ</button>
            <button class="tab-btn" onclick="switchTab(this, '4')">4 ВЖ</button>
        </div>
    </div>

    <div class="top-panel-wrapper"><div class="top-panel">
        <div id="page13" class="page-content" style="display:block;"><div id="list13" class="player-list"></div></div>
        <div id="page4" class="page-content" style="display:none;"><div id="list4" class="player-list"></div></div>
    </div></div>

    <div class="admin-panel" id="adminPanel">
        <input type="text" id="nickInput" placeholder="Никнейм">
        <input type="text" id="pointsInput" placeholder="Очки">
        <select id="sectionSelect"><option value="1-3">Раздел 1-3 ВЖ</option><option value="4">Раздел 4 ВЖ</option></select>
        <select id="tierSelect">
            <optgroup label="Незерит"><option value="t-netherite">Незеритовый тир 1</option><option value="t-netherite">Незеритовый тир 2</option><option value="t-netherite">Незеритовый тир 3</option></optgroup>
            <optgroup label="Алмаз"><option value="t-diamond">Алмазный тир 1</option><option value="t-diamond">Алмазный тир 2</option><option value="t-diamond">Алмазный тир 3</option></optgroup>
            <optgroup label="Золото"><option value="t-gold">Золотой тир 1</option><option value="t-gold">Золотой тир 2</option><option value="t-gold">Золотой тир 3</option></optgroup>
            <optgroup label="Железо"><option value="t-iron">Железный тир 1</option><option value="t-iron">Железный тир 2</option><option value="t-iron">Железный тир 3</option></optgroup>
        </select>
        <button class="add-btn" onclick="addPlayer()">Добавить</button>
        <button class="save-btn" onclick="exportCode()">💾 Сохранить изменения</button>
    </div>

    <script id="playersData">
        let players = [];
    </script>

    <script>
        const MY_PASS = "132132_1183";
        let isAdmin = false;

        function render() {
            const list13 = document.getElementById('list13');
            const list4 = document.getElementById('list4');
            list13.innerHTML = ''; list4.innerHTML = '';
            players.sort((a, b) => (parseInt(b.pts.replace(/\s+/g, '')) || 0) - (parseInt(a.pts.replace(/\s+/g, '')) || 0));
            players.forEach((p, index) => {
                const is13 = p.section === '1-3';
                const count = is13 ? ++list13.children.length : ++list4.children.length;
                const card = document.createElement('div');
                card.className = `player-card ${count <= 3 ? 'rank-'+count : ''}`;
                card.innerHTML = `<span class="rank">${count}</span><span class="nickname">${p.nick}</span><div class="tier-badge ${p.tClass}">⚔ ${p.tText}</div><div class="points">${p.pts}</div><button class="del-btn" onclick="removePlayer(${index})">✕</button>`;
                (is13 ? list13 : list4).appendChild(card);
            });
        }

        function addPlayer() {
            const nick = document.getElementById('nickInput').value.trim();
            const pts = document.getElementById('pointsInput').value.trim() || "0";
            const section = document.getElementById('sectionSelect').value;
            const sel = document.getElementById('tierSelect');
            if(!nick) return;
            players.push({ nick, pts, section, tText: sel.options[sel.selectedIndex].text, tClass: sel.value });
            render();
        }

        function removePlayer(index) { if(confirm("Удалить игрока?")) { players.splice(index, 1); render(); } }

        function tryLogin() {
            let pass = prompt("Пароль:");
            if (pass === MY_PASS) {
                isAdmin = true;
                document.getElementById('loginBtn').innerText = "Logout";
                document.getElementById('adminPanel').style.display = 'flex';
                document.getElementById('mainBody').classList.add('admin-mode');
                render();
            }
        }

        function switchTab(btn, section) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('page13').style.display = (section === '1-3') ? 'block' : 'none';
            document.getElementById('page4').style.display = (section === '4') ? 'block' : 'none';
        }

        function exportCode() {
            let clone = document.documentElement.cloneNode(true);
            clone.querySelector('body').classList.remove('admin-mode');
            clone.querySelector('#adminPanel').style.display = 'none';
            clone.querySelector('#loginBtn').innerText = "Admin Hub";
            clone.querySelectorAll('.del-btn').forEach(btn => btn.style.display = 'none');
            let updatedHTML = clone.outerHTML;
            let playersString = `let players = ${JSON.stringify(players, null, 4)};`;
            updatedHTML = updatedHTML.replace(/let players = \[.*?\];/s, playersString);
            let blob = new Blob(["<!DOCTYPE html>\n" + updatedHTML], {type: "text/html"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "index.html";
            a.click();
            alert("Файл скачан! Загрузи его на GitHub.");
        }
        render();
    </script>
</body>
</html>

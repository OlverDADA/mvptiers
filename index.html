<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MVPtiers | Elite Leaderboard</title>
    <style>
        :root {
            --bg-dark: #05060a;
            --card-bg: rgba(18, 20, 28, 0.7);
            --panel-bg: rgba(10, 11, 18, 0.45);
            --border: rgba(255, 255, 255, 0.08);
            --accent-purple: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            --accent-yellow: #f1c40f;
            
            /* Цвета для материалов (Тиров) */
            --clr-netherite: #3d3d3d; /* Темно-серый */
            --clr-diamond: #33ebff;   /* Неоновый голубой */
            --clr-gold: #ffcc00;      /* Золотой */
            --clr-iron: #ced4da;      /* Железный */

            /* Градиенты ников ТОП-3 */
            --grad-gold: linear-gradient(90deg, #fff2ac 0%, #ffa751 100%);
            --grad-silver: linear-gradient(90deg, #ffffff 0%, #e0e0e0 100%);
            --grad-bronze: linear-gradient(90deg, #ff9d6c 0%, #9e4b1d 100%);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
            padding: 80px 20px; margin: 0; min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
        }

        /* --- АНИМИРОВАННЫЙ ФОН --- */
        .space-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
        .space-bg::before {
            content: ""; position: absolute; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(124, 58, 237, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(124, 58, 237, 0.05) 1px, transparent 1px);
            background-size: 100px 100px; top: -50%; left: -50%; transform: rotate(15deg); animation: gridMove 120s linear infinite;
        }
        @keyframes gridMove { from { transform: rotate(15deg) translateY(0); } to { transform: rotate(15deg) translateY(-1000px); } }

        /* --- ЛОГОТИП --- */
        .logo-wrapper { position: relative; margin-bottom: 50px; }
        .logo {
            font-size: 5.5em; font-weight: 900; background: var(--accent-purple);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -4px; margin: 0;
        }

        .admin-login-btn {
            position: fixed; top: 20px; right: 20px; padding: 10px 25px;
            border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05); color: #888;
            border-radius: 8px; cursor: pointer; z-index: 100; font-weight: bold;
        }

        .tabs-container { display: flex; gap: 20px; margin-bottom: 45px; z-index: 10; }
        .tab-btn {
            padding: 14px 45px; border: 2px solid var(--accent-yellow); background: transparent;
            color: var(--accent-yellow); font-weight: 800; text-transform: uppercase; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { background: var(--accent-yellow); color: #000; box-shadow: 0 0 40px rgba(241, 196, 15, 0.3); }

        /* --- ПАНЕЛЬ ТОПА --- */
        .top-panel {
            width: 100%; max-width: 950px; background: var(--panel-bg); border-radius: 24px;
            padding: 30px; border: 1px solid rgba(124, 58, 237, 0.2); backdrop-filter: blur(25px); z-index: 10;
        }
        .player-list { display: flex; flex-direction: column; gap: 12px; }

        .player-card {
            background: var(--card-bg); padding: 20px 35px; border-radius: 16px;
            display: grid; grid-template-columns: 45px 1fr 30px 250px 30px 140px;
            align-items: center; border: 1px solid var(--border); transition: 0.4s;
        }
        body.admin-mode .player-card { grid-template-columns: 45px 1fr 30px 250px 30px 140px 45px; }

        .rank-1 { border: 4px solid #ffcc00; box-shadow: 0 0 25px rgba(255, 204, 0, 0.2); }
        .rank-2 { border: 4px solid #ffffff; box-shadow: 0 0 25px rgba(255, 255, 255, 0.15); }
        .rank-3 { border: 4px solid #cd7f32; box-shadow: 0 0 20px rgba(205, 127, 50, 0.15); }

        .nickname { font-size: 1.6em; font-weight: 800; color: #fff; }
        .rank-1 .nickname { background: var(--grad-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .rank-2 .nickname { background: var(--grad-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .rank-3 .nickname { background: var(--grad-bronze); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* СТИЛИ ДЛЯ ТИРОВ */
        .tier-badge { font-weight: 900; text-transform: uppercase; font-size: 1.1em; display: flex; align-items: center; gap: 10px; justify-content: center; }
        .t-netherite { color: var(--clr-netherite); text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .t-diamond { color: var(--clr-diamond); text-shadow: 0 0 10px rgba(51, 235, 255, 0.3); }
        .t-gold { color: var(--clr-gold); text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
        .t-iron { color: var(--clr-iron); text-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .points { text-align: right; font-weight: 900; color: #fff; font-size: 1.4em; }
        .points span { color: #5d627e; font-size: 0.7em; margin-left: 5px; }

        .del-btn { display: none; background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.5em; opacity: 0.6; }
        body.admin-mode .del-btn { display: block; }

        .admin-panel {
            display: none; margin-top: 40px; background: rgba(15, 17, 26, 0.95); padding: 30px; 
            border-radius: 20px; flex-wrap: wrap; gap: 15px; border: 1px solid var(--accent-yellow); width: 100%; max-width: 890px;
        }
        input, select, .add-btn { padding: 14px; border-radius: 10px; border: 1px solid #2d3247; background: #05060a; color: white; outline: none; }
        .add-btn { background: #7c3aed; border: none; font-weight: bold; cursor: pointer; padding: 14px 45px; }
    </style>
</head>
<body id="mainBody">

    <div class="space-bg"></div>
    <button class="admin-login-btn" id="loginBtn" onclick="tryLogin()">Вход</button>

    <div class="logo-wrapper">
        <h1 class="logo">MVPtiers</h1>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab(this, '1-3')">1-3 ВЖ</button>
        <button class="tab-btn" onclick="switchTab(this, '4')">4 ВЖ</button>
    </div>

    <div class="top-panel">
        <div id="page13" class="page-content" style="display:block;"><div id="list13" class="player-list"></div></div>
        <div id="page4" class="page-content" style="display:none;"><div id="list4" class="player-list"></div></div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <input type="text" id="nickInput" placeholder="Никнейм">
        <input type="text" id="pointsInput" placeholder="Очки">
        <select id="sectionSelect">
            <option value="1-3">Раздел 1-3 ВЖ</option>
            <option value="4">Раздел 4 ВЖ</option>
        </select>
        <select id="tierSelect">
            <optgroup label="Незерит"><option value="t-netherite">Незеритовый тир 1</option><option value="t-netherite">Незеритовый тир 2</option><option value="t-netherite">Незеритовый тир 3</option></optgroup>
            <optgroup label="Алмаз"><option value="t-diamond">Алмазный тир 1</option><option value="t-diamond">Алмазный тир 2</option><option value="t-diamond">Алмазный тир 3</option></optgroup>
            <optgroup label="Золото"><option value="t-gold">Золотой тир 1</option><option value="t-gold">Золотой тир 2</option><option value="t-gold">Золотой тир 3</option></optgroup>
            <optgroup label="Железо"><option value="t-iron">Железный тир 1</option><option value="t-iron">Железный тир 2</option><option value="t-iron">Железный тир 3</option></optgroup>
        </select>
        <button class="add-btn" onclick="addPlayer()">Добавить</button>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mvp_live_vFinal')) || [];
        const MY_PASS = "132132_1183";
        let isAdmin = false;

        function tryLogin() {
            if (!isAdmin) {
                let pass = prompt("Ключ доступа:");
                if (pass === MY_PASS) {
                    isAdmin = true;
                    document.getElementById('loginBtn').innerText = "Выйти";
                    document.getElementById('adminPanel').style.display = 'flex';
                    document.getElementById('mainBody').classList.add('admin-mode');
                    render();
                }
            } else {
                isAdmin = false;
                document.getElementById('loginBtn').innerText = "Вход";
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('mainBody').classList.remove('admin-mode');
                render();
            }
        }

        function switchTab(btn, section) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('page13').style.display = (section === '1-3') ? 'block' : 'none';
            document.getElementById('page4').style.display = (section === '4') ? 'block' : 'none';
        }

        function render() {
            const list13 = document.getElementById('list13');
            const list4 = document.getElementById('list4');
            list13.innerHTML = ''; list4.innerHTML = '';
            players.sort((a, b) => (parseInt(b.pts.replace(/\s+/g, '')) || 0) - (parseInt(a.pts.replace(/\s+/g, '')) || 0));
            players.forEach((p, i) => {
                const is13 = p.section === '1-3';
                const rank = (is13 ? ++list13.children.length : ++list4.children.length);
                const card = document.createElement('div');
                card.className = `player-card rank-${rank}`;
                card.innerHTML = `
                    <span class="rank">${rank}.</span>
                    <span class="nickname">${p.nick}</span>
                    <span class="sep">/</span>
                    <div class="tier-badge ${p.tClass}">⚔ ${p.tText}</div>
                    <span class="sep">/</span>
                    <div class="points">${p.pts} <span>Points</span></div>
                    <button class="del-btn" onclick="remove(${i})">✕</button>
                `;
                (is13 ? list13 : list4).appendChild(card);
            });
        }

        function addPlayer() {
            const nick = document.getElementById('nickInput').value.trim();
            const pts = document.getElementById('pointsInput').value.trim() || "0";
            const section = document.getElementById('sectionSelect').value;
            const sel = document.getElementById('tierSelect');
            if(!nick) return;
            players.push({ nick, pts, section, tText: sel.options[sel.selectedIndex].text, tClass: sel.value });
            save();
            document.getElementById('nickInput').value = '';
            document.getElementById('pointsInput').value = '';
        }

        function remove(i) { if(confirm("Удалить игрока?")) { players.splice(i, 1); save(); } }
        function save() { localStorage.setItem('mvp_live_vFinal', JSON.stringify(players)); render(); }
        render();
    </script>
</body>
</html>
